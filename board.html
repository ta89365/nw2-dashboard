<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NW2 看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--good:#1E8E4E;--bad:#C62828;--bg:#EEF1F4;--card:#FFFFFF;--ink:#14181F;--sub:#4A5260;--line:#E3E7ED;--accent:#2457D6;--warn:#B4500B;--chip:#DCE3EC;--dark:#14181F;--darkink:#FFFFFF;--darksub:#AEB6C2}
body.night{--good:#5BC98A;--bad:#FF7A7A;--bg:#0F1318;--card:#1A2028;--ink:#E8ECF1;--sub:#9AA5B3;--line:#2A323D;--accent:#8FB0FF;--warn:#F0A35E;--chip:#24364F;--dark:#24364F;--darkink:#E8ECF1;--darksub:#9AA5B3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
.num{font-family:'Space Grotesk',sans-serif}
#app{height:100vh;display:flex;flex-direction:column;padding:28px 40px 24px;gap:20px}
header{display:flex;align-items:flex-end;gap:24px}
.clock{font-size:88px;font-weight:600;line-height:1;letter-spacing:-2px}
.date{font-size:19px;color:var(--sub);font-weight:500}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:18px;height:100%}
.tabs{display:flex;gap:8px}
.tab{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;min-height:0}
.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.card.dark{background:var(--dark);color:var(--darkink)}
.card h2{margin:0 0 8px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .n{font-family:'Space Grotesk',sans-serif;color:var(--sub);font-weight:600}
.card.dark h2 .n{color:var(--darksub)}
.list{overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.card.dark .row{border-color:rgba(255,255,255,.12)}
.check{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid #9AA3B0;background:transparent}
.check:active{background:var(--accent)}
.who{flex:none;width:44px;height:44px;border-radius:22px;background:#E4ECFB;color:#2457D6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
body.night .who{background:#24364F;color:#C3D4FF}
.t{font-size:17px;font-weight:500;line-height:1.38}
.m{font-size:13.5px;color:var(--sub);margin-top:3px}
.card.dark .m{color:var(--darksub)}
.m.late{color:var(--warn)}
.btn{flex:none;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px}
.btn.primary{background:var(--accent);border:none;color:var(--bg);font-weight:700}
.empty{color:var(--sub);font-size:16px;padding:12px 0}
/* morning */
.hero{background:var(--card);border-radius:22px;padding:26px 32px;display:flex;align-items:center;gap:28px}
.hero .lab{font-size:17px;font-weight:700;color:var(--warn)}
.hero .ttl{font-size:34px;font-weight:700;line-height:1.22;margin-top:6px}
.big{height:68px;padding:0 34px;border-radius:16px;font-size:21px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:100%}
.col{background:var(--chip);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.col.today{background:var(--dark);color:var(--darkink)}
.col h2{margin:0;padding:0 4px;font-size:19px;display:flex;justify-content:space-between}
.col .list{display:flex;flex-direction:column;gap:9px}
.k{background:var(--card);border-radius:12px;padding:11px 13px;border:1px solid var(--line);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:500;background:var(--chip);color:var(--ink);margin-right:6px}
.split{display:grid;grid-template-columns:5fr 7fr;gap:32px;height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border-radius:12px;padding:10px 0;text-align:center}
.day.busy{background:var(--chip)}
.day .d{font-size:13px;color:var(--sub)}
.day .c{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600}
.day:not(.busy) .c{color:var(--sub)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center}
#login form{background:var(--card);padding:36px;border-radius:20px;display:flex;flex-direction:column;gap:14px;width:520px}
#login input{height:52px;font-size:18px;padding:0 14px;border-radius:12px;border:1px solid var(--line)}
.hchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:5px;flex:none;background:var(--good)}
.lv-warn .dot,.dot.lv-warn{background:var(--warn)}
.lv-bad .dot,.dot.lv-bad{background:var(--bad)}
.hchip.lv-bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.hchip.lv-warn{border-color:var(--warn)}
#healthPanel{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;z-index:5}
#healthPanel .sheet{background:var(--bg);border-radius:22px;padding:24px 26px;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hrow .dot{margin-top:0}
.hname{flex:1;font-size:16px;font-weight:500}
.hnote{font-size:14px;color:var(--sub);text-align:right}
.hrow.lv-bad .hnote{color:var(--bad);font-weight:700}
.hrow.lv-warn .hnote{color:var(--warn)}
.halert{padding:10px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;font-size:16px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="date" id="date"></div><div class="clock num" id="clock">--:--</div></div>
    <div class="grow"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <nav class="tabs" aria-label="模式">
        <button class="tab" data-mode="auto" type="button">自動</button>
        <button class="tab" data-mode="morning" type="button">早上</button>
        <button class="tab" data-mode="work" type="button">上班</button>
        <button class="tab" data-mode="evening" type="button">晚上</button>
        <button class="tab" id="refresh" type="button" aria-label="重新整理">↻</button>
        <button class="tab" id="fs" type="button">全螢幕</button>
      </nav>
      <button class="hchip" id="status" type="button" aria-label="系統健康狀態"><span class="dot"></span><span id="statusText"></span></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="login"><form id="loginForm">
  <div style="font-size:22px;font-weight:700">NW2 看板</div>
  <label for="key" style="color:var(--sub)">輸入看板金鑰（只要輸入一次，存在這台電腦的瀏覽器）</label>
  <input id="key" type="password" autocomplete="off">
  <button class="btn primary big" type="submit">開始</button>
</form></div>
<div id="healthPanel"><div class="sheet"><div style="display:flex;align-items:center;gap:12px"><h2 style="margin:0;font-size:22px;flex:1">系統健康</h2><button class="btn" id="healthClose" type="button">關閉</button></div><div class="list" id="healthBody"></div></div></div>
<div id="toast"></div>
<script>
const API = 'https://saqlqwushpkdtwsnebed.supabase.co/functions/v1/nw2-dashboard';
const POLL_MS = 60_000;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let key = store.get('nw2.key');
let mode = store.get('nw2.mode') || 'auto';
let data = null, lastOk = 0, failing = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','一','二','三','四','五','六'];
const chi = () => { // Houston wall clock
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { h: +p.hour % 24, m: +p.minute, mon: +p.month, day: +p.day, wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };
};
const autoMode = () => { const { h, wd } = chi(); if (h >= 18 || h < 6) return 'evening'; if (h < 9 || wd === 0 || wd === 6) return 'morning'; return 'work'; };
const curMode = () => mode === 'auto' ? autoMode() : mode;
const shortDay = (ymd) => { const d = new Date(ymd + 'T12:00:00Z'); return `${WD[d.getUTCDay()]} ${d.getUTCMonth()+1}/${d.getUTCDate()}`; };

// ═══ 架構（2026-10-27 NW2-Board）══════════════════════════════════════
// 這個檔案是看板本體（board.html）。index.html 是外殼：用 iframe 把這頁包起來，全螢幕放在外殼上，
// 所以這頁重新載入（每天 04:00、Ctrl+R、F5）都不會離開全螢幕。單獨開 board.html 也能用（全螢幕就在自己身上）。
// 資料層：load() 抓一次，5 種版面共用同一份 data。
// 積木層：BLOCKS，每種內容只寫一次（任務卡長相、顏色、按鈕規則在這裡）。改積木 → 所有版面一起變。
// 版面層：LAYOUTS，每種螢幕 × 每個模式（morning／work／evening）放哪些積木、怎麼排。改版面 → 只影響那一種。
//   desk    ① 橫向桌面 1920×1080（公司 Dell 27 吋、家裡 S39C、台灣 VX3276）
//   tall    ② 直立螢幕 1080×1920（公司 Dell 24、家裡 LF24T450F、台灣 23 吋）
//   compact ③ 小螢幕橫向 ~1368×912（Surface 看板、Dragonfly G4／G2、iPad 橫放）
//   narrow  ④ 窄螢幕（iPhone、iPad 直放）
//   tv      ⑤ 客廳電視（網址加 ?view=tv）
// 網址加 ?view=<名稱> 可強制使用某種版面。

// ── 共用小零件 ──
function meta(t, opts = {}, inline = false) {
  const bits = [];
  if (t.project) bits.push(esc(t.project));
  if (t.time) bits.push(t.time);
  let late = false;
  if (t.late_days > 0) { bits.push(t.late_days === 1 ? '昨天的' : `逾期 ${t.late_days} 天`); late = true; }
  else if (opts.showDate && (t.do_date || t.due_date)) bits.push(shortDay(t.do_date || t.due_date));
  if (t.due_in !== null && t.due_in <= 0 && !(t.late_days > 0)) { bits.push(t.due_in === 0 ? '今天到期' : `過期 ${-t.due_in} 天`); late = true; }
  else if (t.due_in !== null && t.due_in > 0 && t.due_in <= 3) bits.push(`${t.due_in} 天後到期`);
  const tag = inline ? 'span' : 'div';
  return `<${tag} class="m${late ? ' late' : ''}">${bits.join(' · ')}</${tag}>`;
}
const initial = (title) => { const m = /^(?:Waiting on|Follow up)\s+([^\s:,&]+)/i.exec(title) || /^([^\s:]+):/.exec(title); return m ? esc([...m[1]].slice(0, 2).join('')) : '…'; };
const cleanTitle = (title) => esc(title.replace(/^Waiting on\s+/i, ''));
const list = (items, fn, empty, opts) => items.length ? items.map((t) => fn(t, opts)).join('') : `<div class="empty">${empty}</div>`;

// ── 任務列的幾種樣式（積木裡用 row: '<名稱>' 指定）──
const ROWS = {
  // 左邊打勾
  check: (t, opts) => `<div class="row"><button class="check" type="button" aria-label="完成" data-act="done" data-id="${t.page_id}"></button><div style="min-width:0"><div class="t">${esc(t.title)}</div>${meta(t, opts)}</div></div>`,
  // 左邊人名縮寫、右邊「明天」（要追的人）
  who: (t, opts) => `<div class="row"><div class="who" aria-hidden="true">${initial(t.title)}</div><div style="min-width:0;flex:1"><div class="t">${cleanTitle(t.title)}</div>${meta(t, opts)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">明天</button></div>`,
  // 右邊「改明天」＋「完成」
  both: (t) => `<div class="row"><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div>${meta(t)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">改明天</button><button class="btn primary" type="button" data-act="done" data-id="${t.page_id}">完成</button></div>`,
  // 左邊時間（明天的行程）
  timed: (t) => `<div class="row"><div style="flex:none;width:64px;color:var(--sub);font-size:15px;padding-top:2px" class="num">${t.time || '全天'}</div><div style="min-width:0"><div class="t" style="font-size:18px">${esc(t.title)}</div>${meta(t)}</div></div>`,
  // 看板式小卡（上班模式的欄）
  kcard: (t, opts) => {
    const tags = t.project ? `<span class="tag">${esc(t.project.split(' - ')[0])}</span>` : '';
    const m = meta({ ...t, project: null }, opts, true);
    return `<div class="k"><button class="check" style="width:36px;height:36px" type="button" aria-label="完成" data-act="done" data-id="${t.page_id}"></button><div style="min-width:0"><div class="t" style="font-size:15.5px">${esc(t.title)}</div><div style="margin-top:6px">${tags}${m}</div></div></div>`;
  },
};

// ── 資料整理：從 API 的 data 算出積木要用的清單 ──
function derive(d) {
  const hero = d.reminders[0] || d.today_list[0] || null;
  const rest = d.today_list.filter((t) => t !== hero && t.page_id !== hero?.page_id);
  return { ...d, hero, rest };
}

// ── 積木 ──
// 每塊：(v, o) => HTML。v = derive 過的資料；o = 版面設定裡這塊的選項（items 指定用哪份清單）。
const BLOCKS = {
  // 最上面的大卡：第一個提醒，沒有就今天第一件
  hero: (v) => {
    const h = v.hero;
    if (!h) return `<section class="hero"><div class="ttl">今天沒有排定的事</div></section>`;
    return `<section class="hero"><div style="flex:1;min-width:0"><div class="lab">${h.time ? `${h.time} 提醒` : '今天第一件'}</div><div class="ttl">${esc(h.title)}</div></div>
      <button class="btn big" type="button" data-act="tomorrow" data-id="${h.page_id}">改明天</button>
      <button class="btn primary big" type="button" data-act="done" data-id="${h.page_id}">完成</button></section>`;
  },
  // 白色卡片＋任務列表。o: title（文字或函式）, items, row, empty, cls, style, count, countStyle, h2Style, opts
  tasks: (v, o) => {
    const items = v[o.items];
    return `<section class="card${o.cls ? ' ' + o.cls : ''}"${o.style ? ` style="${o.style}"` : ''}><h2${o.h2Style ? ` style="${o.h2Style}"` : ''}>${typeof o.title === 'function' ? o.title(v) : o.title} <span class="n"${o.countStyle ? ` style="${o.countStyle}"` : ''}>${o.count ? o.count(items, v) : items.length}</span></h2><div class="list">${list(items, ROWS[o.row], o.empty, o.opts)}</div></section>`;
  },
  // 看板式欄（上班模式）。o: title, items, cls, empty, opts
  column: (v, o) => {
    const items = v[o.items];
    return `<section class="col ${o.cls || ''}"><h2>${o.title}<span class="num">${items.length}</span></h2><div class="list">${list(items, ROWS.kcard, o.empty, o.opts)}</div></section>`;
  },
  // NW2 想問你（深色卡）
  questions: (v) => {
    const q = v.questions;
    return `<section class="card dark"><h2>NW2 想問你 <span class="n">${q.total}</span></h2><div class="list">${q.items.length ? q.items.map((x) => `<div class="row"><div><div class="m">${esc(x.topic)}</div><div class="t" style="font-weight:400">${esc(x.question)}</div></div></div>`).join('') : '<div class="empty">沒有待答的題目</div>'}</div>
        <div class="m" style="padding-top:8px">到 NW2-Ask 回答（每天 12:10、20:30 會貼）</div></section>`;
  },
  // 系統健康：9 項即時檢查＋NW2-Daily／巡檢還沒解決的提醒（資料 data.health，唯讀）
  health: (v) => {
    const h = v.health;
    if (!h) return '<div class="empty">健康資料暫時讀不到（任務資料不受影響）</div>';
    const rows = h.checks.map((c) => `<div class="hrow lv-${c.level}"><span class="dot lv-${c.level}"></span><div class="hname">${esc(c.name)}</div><div class="hnote">${esc(c.note)}</div></div>`).join('');
    const al = h.alerts.length ? `<h2 style="margin:14px 0 4px;font-size:17px">還沒解決的提醒 <span class="n">${h.alerts.length}</span></h2>` + h.alerts.map((a) => `<div class="halert"><div class="t" style="font-size:15.5px">${esc(a.item)}</div><div class="m">${esc(a.since)} · ${esc(a.source)}</div><div class="m" style="margin-top:4px">${esc(a.detail)}</div></div>`).join('') : '';
    return rows + al;
  },
  // 接下來 7 天（每天件數）＋之後的
  week: (v) => `<section><h2 style="margin:0 0 10px;font-size:19px">接下來 7 天</h2><div class="week">${v.week.map((w) => `<div class="day${w.n ? ' busy' : ''}"><div class="d">${shortDay(w.date)}</div><div class="c">${w.n}</div></div>`).join('')}</div>
        ${v.later.length ? `<div class="m" style="margin-top:8px">之後：${v.later.slice(0, 3).map((t) => `${esc(t.title)}（${shortDay(t.do_date || t.due_date)}）`).join('、')}</div>` : ''}</section>`,
};

// ── 版面 ──
// 節點：'積木名稱'、{ block: '積木名稱', ...選項 }、或容器 { cls, style, items: [節點…] }。
const T = { // 常用的積木設定，各版面共用
  todayRest:  { block: 'tasks', title: '今天要做', items: 'rest', row: 'check', empty: '沒有了' },
  followRows: { block: 'tasks', title: '今天要追', items: 'follow_today', row: 'who', empty: '今天沒有要追的人' },
  colToday:   { block: 'column', title: '今天', items: 'today_list', cls: 'today', empty: '今天的都做完了' },
  colFollow:  { block: 'column', title: '今天要追', items: 'follow_today', empty: '今天沒有要追的人' },
  colWaiting: { block: 'column', title: '等回覆', items: 'waiting', empty: '沒有在等的', opts: { showDate: true } },
  colUndated: { block: 'column', title: '沒排日期', items: 'undated', empty: '沒有' },
  leftToday:  { block: 'tasks', title: '今天還沒結的', items: 'today_list', row: 'both', empty: '今天的都結了', style: 'flex:1', countStyle: 'color:var(--warn)' },
  tomorrow:   { block: 'tasks', title: (v) => `明天 · ${shortDay(v.tomorrow)}`, count: (items) => `${items.length} 件`, items: 'tomorrow_list', row: 'timed', empty: '明天沒有排定的事', style: 'padding:26px 30px', h2Style: 'font-size:26px', countStyle: 'font-size:16px' },
};
const LAYOUTS = {
  compact: {
    morning: { cls: 'stack', items: ['hero', { cls: 'grid3', style: 'flex:1', items: [T.todayRest, T.followRows, 'questions'] }] },
    work: { cls: 'grid4', items: [T.colToday, T.colFollow, T.colWaiting, T.colUndated] },
    evening: { cls: 'split', items: [{ cls: 'stack', style: 'gap:22px;min-height:0;height:auto', items: ['week', T.leftToday] }, T.tomorrow] },
  },
};
// 還沒設計的版面先沿用 compact（之後一種一種定）
for (const k of ['desk', 'tall', 'narrow', 'tv']) LAYOUTS[k] ??= LAYOUTS.compact;

function build(node, v) {
  if (typeof node === 'string') return BLOCKS[node](v, {});
  if (node.block) return BLOCKS[node.block](v, node);
  return `<div${node.cls ? ` class="${node.cls}"` : ''}${node.style ? ` style="${node.style}"` : ''}>${node.items.map((n) => build(n, v)).join('')}</div>`;
}

// 判斷這個畫面用哪種版面
function detectLayout() {
  const forced = new URLSearchParams(location.search).get('view');
  if (forced && LAYOUTS[forced]) return forced;
  const w = innerWidth, h = innerHeight;
  if (w < 760) return 'narrow';
  if (h > w) return h / w >= 1.55 ? 'tall' : 'narrow';
  if (w >= 1700) return 'desk';
  return 'compact';
}

function render() {
  const m = curMode();
  const lay = detectLayout();
  document.body.classList.toggle('night', m === 'evening');
  document.body.dataset.layout = lay;
  document.querySelectorAll('.tab[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  if (!data) return;
  $('main').innerHTML = build(LAYOUTS[lay][m], derive(data));
}
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 200); });
function tick() {
  const c = chi();
  $('clock').textContent = `${String(c.h).padStart(2,'0')}:${String(c.m).padStart(2,'0')}`;
  $('date').textContent = `星期${WD[c.wd]} · ${c.mon} 月 ${c.day} 日`;
  const st = $('status');
  if (data) {
    const syncMin = data.synced_at ? Math.round((Date.now() - Date.parse(data.synced_at)) / 60000) : null;
    const stale = failing || Date.now() - lastOk > 5 * 60000;
    const h = data.health;
    const lv = stale ? 'bad' : h ? h.level : 'ok';
    st.className = 'hchip lv-' + lv;
    $('statusText').textContent = stale ? '連不上 NW2，顯示的是舊資料'
      : !h ? `Notion 同步於 ${syncMin} 分鐘前`
      : h.level === 'ok' ? `系統正常 · Notion ${syncMin} 分鐘前`
      : h.bad ? `${h.bad} 項異常${h.warn ? `、${h.warn} 項要注意` : ''}` : `${h.warn} 項要注意`;
  }
}
let lastMode = null;
setInterval(() => { tick(); const m = curMode(); if (m !== lastMode) { lastMode = m; render(); } }, 10_000);

async function load() {
  if (!key) return showLogin();
  try {
    const r = await fetch(API, { headers: { 'x-nw2-dash': key }, cache: 'no-store' });
    if (r.status === 401) { key = null; return showLogin('金鑰不對，請重新輸入'); }
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failing = false; render();
    if ($('healthPanel').style.display === 'flex') openHealth();
  } catch (e) { failing = true; }
  tick();
}
async function act(action, id) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'x-nw2-dash': key, 'content-type': 'application/json' }, body: JSON.stringify({ action, page_id: id }) });
    toast(r.ok ? (action === 'done' ? '已打勾 Done' : action === 'tomorrow' ? '已改到明天' : '已請 Notion 重新同步') : '沒成功，稍後再試');
  } catch { toast('連不上 NW2'); }
  load();
}
function openHealth() { if (!data) return; $('healthBody').innerHTML = BLOCKS.health(derive(data)); $('healthPanel').style.display = 'flex'; }
$('healthPanel').addEventListener('click', (e) => { if (e.target.id === 'healthPanel') $('healthPanel').style.display = 'none'; });
function toast(s) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2500); }
function showLogin(msg) { $('login').style.display = 'flex'; if (msg) toast(msg); $('key').focus(); }
$('loginForm').addEventListener('submit', (e) => { e.preventDefault(); key = $('key').value.trim(); store.set('nw2.key', key); $('login').style.display = 'none'; load(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { mode = b.dataset.mode; store.set('nw2.mode', mode); render(); return; }
  if (b.id === 'fs') { toggleFs(); return; }
  if (b.id === 'status') { openHealth(); return; }
  if (b.id === 'healthClose') { $('healthPanel').style.display = 'none'; return; }
  if (b.id === 'refresh') { act('refresh'); setTimeout(load, 8000); return; }
  if (b.dataset.act && b.dataset.id) { b.disabled = true; act(b.dataset.act, b.dataset.id); }
});
// Keep the screen on while the page is visible.
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); load(); } });
// Full screen (a page cannot minimize its own window: leave full screen, then use the title bar's — button).
// Inside the shell (index.html) full screen goes on the SHELL's document, so reloading this board keeps it.
const fsDoc = (() => { try { return window.top.document; } catch { return document; } })();
const inShell = fsDoc !== document;
const fsOn = () => !!fsDoc.fullscreenElement;
async function toggleFs() { try { if (fsOn()) await fsDoc.exitFullscreen(); else await fsDoc.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch {} }
const fsLabel = () => { $('fs').textContent = fsOn() ? '離開全螢幕' : '全螢幕'; };
fsDoc.addEventListener('fullscreenchange', fsLabel);
addEventListener('pagehide', () => fsDoc.removeEventListener('fullscreenchange', fsLabel));
// In the shell: F5 / Ctrl+R reload only this board (full screen stays); Ctrl+Shift+R reloads the whole shell (full screen drops, tap once).
document.addEventListener('keydown', (e) => {
  if (!inShell || (e.key !== 'F5' && !(e.ctrlKey && (e.key === 'r' || e.key === 'R')))) return;
  e.preventDefault();
  if (e.shiftKey) window.top.location.reload(); else location.reload();
}, { capture: true });
// After an automatic start the window is only maximized (browsers allow full screen only after a tap): the first tap anywhere enters it.
let firstTap = true;
document.addEventListener('pointerdown', (e) => { if (!firstTap) return; firstTap = false; if (!fsOn() && !e.target.closest('#fs, #login')) toggleFs(); }, { capture: true });
// Ben 2026-10-27: the Surface start-up script sends one harmless key (F13) after opening the board, so it goes full screen
// by itself. Any first key except Escape counts; never while the key-entry box is showing.
document.addEventListener('keydown', (e) => { if (!firstTap || e.key === 'Escape' || $('login').style.display === 'flex') return; firstTap = false; if (!fsOn()) toggleFs(); }, { capture: true });
wake(); tick(); render(); load(); fsLabel(); setInterval(load, POLL_MS);
// Once a day (04:00) reload to pick up a new version of this page, but only when there is one
// (compares the HTML on the server with the copy fetched at start-up; inside the shell only this board reloads).
let selfHtml = null;
const fetchSelf = async () => { const r = await fetch(location.pathname, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.text(); };
fetchSelf().then((t) => { selfHtml = t; }).catch(() => {});
setInterval(async () => { const c = chi(); if (c.h !== 4 || c.m >= 2) return; try { const t = await fetchSelf(); if (selfHtml !== null && t !== selfHtml) location.reload(); else selfHtml = t; } catch {} }, 60_000);
</script>
