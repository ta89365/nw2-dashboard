<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--good:#1E8E4E;--bad:#C62828;--amber:#F5B301;--amberbg:#FFF5D6;--bg:#EEF1F4;--card:#FFFFFF;--ink:#14181F;--sub:#4A5260;--line:#E3E7ED;--accent:#2457D6;--warn:#B4500B;--chip:#DCE3EC;--dark:#14181F;--darkink:#FFFFFF;--darksub:#AEB6C2}
body.night{--good:#5BC98A;--bad:#FF7A7A;--amber:#FFC93C;--amberbg:#3A3010;--bg:#0F1318;--card:#1A2028;--ink:#E8ECF1;--sub:#9AA5B3;--line:#2A323D;--accent:#8FB0FF;--warn:#F0A35E;--chip:#24364F;--dark:#24364F;--darkink:#E8ECF1;--darksub:#9AA5B3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
.num{font-family:'Space Grotesk',sans-serif}
#app{height:100vh;display:flex;flex-direction:column;padding:28px 40px 24px;gap:28px}
header{display:flex;align-items:flex-end;gap:24px}
.clock{font-size:82px;font-weight:600;line-height:1;letter-spacing:-2px}
.date{font-size:19px;color:var(--sub);font-weight:500}
.tz{font-size:15px;color:var(--sub);margin-top:5px}
.tz b{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--ink);font-size:16px}
.wx-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aqi{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 11px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--aq) 14%,transparent);color:var(--aq)}
.aqi i{width:8px;height:8px;border-radius:4px;background:var(--aq)}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:18px;height:100%}
.tabs{display:flex;gap:8px}
.tab{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;min-height:0}
.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.card.dark{background:var(--dark);color:var(--darkink)}
.card h2{margin:0 0 8px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .n{font-family:'Space Grotesk',sans-serif;color:var(--sub);font-weight:600}
.card.dark h2 .n{color:var(--darksub)}
.list{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.card.dark .row{border-color:rgba(255,255,255,.12)}
.check{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid #9AA3B0;background:transparent;position:relative;padding:0;transition:background-color .18s,border-color .18s,transform .12s}
.check svg{position:absolute;inset:0;width:100%;height:100%;padding:10px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .28s ease .05s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg path{stroke-dashoffset:0}
.check:active{transform:scale(.92)}
.who{flex:none;width:44px;height:44px;border-radius:22px;background:#E4ECFB;color:#2457D6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
body.night .who{background:#24364F;color:#C3D4FF}
.t{font-size:17px;font-weight:500;line-height:1.38}
.m{font-size:13.5px;color:var(--sub);margin-top:3px}
.card.dark .m{color:var(--darksub)}
.m.late{color:var(--warn)}
.btn{flex:none;height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px}
.btn.primary{background:var(--accent);border:none;color:var(--bg);font-weight:700}
.empty{color:var(--sub);font-size:16px;padding:12px 0}
/* morning */
.hero{background:var(--card);border-radius:22px;padding:26px 32px;display:flex;align-items:center;gap:28px}
.hero .lab{font-size:17px;font-weight:700;color:var(--warn)}
.hero .ttl{font-size:34px;font-weight:700;line-height:1.22;margin-top:6px}
.big{height:68px;padding:0 34px;border-radius:16px;font-size:21px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:100%}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:12px;height:100%}
.col .tl{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line);gap:10px}
.col .tl .tl-time{width:48px;font-size:16px}
.col .tl .t{font-size:15px}
.col .nowline{padding:0 2px}
.stack>.col{flex:1 1 0;min-height:0}
.col{background:var(--chip);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.col.today{background:var(--dark);color:var(--darkink)}
.col h2{margin:0;padding:0 4px;font-size:19px;display:flex;justify-content:space-between}
.col .list{display:flex;flex-direction:column;gap:9px}
.k{background:var(--card);border-radius:12px;padding:11px 13px;border:1px solid var(--line);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:500;background:var(--chip);color:var(--ink);margin-right:6px}
.split{display:grid;grid-template-columns:5fr 7fr;gap:32px;height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border-radius:12px;padding:10px 0;text-align:center}
.day.busy{background:var(--chip)}
.day .d{font-size:13px;color:var(--sub)}
.day .c{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600}
.day:not(.busy) .c{color:var(--sub)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center}
#login form{background:var(--card);padding:36px;border-radius:20px;display:flex;flex-direction:column;gap:14px;width:520px}
#login input{height:52px;font-size:18px;padding:0 14px;border-radius:12px;border:1px solid var(--line)}
.hchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:5px;flex:none;background:var(--good)}
.lv-warn .dot,.dot.lv-warn{background:var(--amber)}
.lv-bad .dot,.dot.lv-bad{background:var(--bad)}
.hchip.lv-bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.hchip.lv-warn{border-color:var(--amber);background:var(--amberbg)}
#healthPanel{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;z-index:5}
#healthPanel .sheet{background:var(--bg);border-radius:22px;padding:24px 26px;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hrow .dot{margin-top:0}
.hname{flex:1;font-size:16px;font-weight:500}
.hnote{font-size:14px;color:var(--sub);text-align:right}
.hrow.lv-bad .hnote{color:var(--bad);font-weight:700}
.hrow.lv-warn .hnote{color:var(--warn)}
.halert{padding:10px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;font-size:16px;display:none}
/* ── Reminders (dash-d3 notices) + weather ── */
.qchip b{font-family:'Space Grotesk',sans-serif}
/* Surface battery (dash-d8, Ben 2026-11-06): quiet while plugged in, amber / red when running on battery */
.bchip{cursor:default;color:var(--sub);display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif}
.bchip svg{width:22px;height:12px;flex:none}
.bchip.on-bat{color:var(--warn);font-weight:700;border-color:var(--warn)}
.bchip.low{color:var(--bad);border-color:var(--bad)}
.bchip.charging{color:var(--good);font-weight:700;border-color:var(--good)}
.bchip.charging .bolt{animation:boltPulse 2.4s ease-in-out infinite}
@keyframes boltPulse{0%,100%{opacity:1}50%{opacity:.35}}
.chips{display:flex;gap:8px}
.grid3a{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,4fr);grid-template-rows:minmax(0,1fr);gap:18px;height:100%;min-height:0}
.stack>.card{flex:1 1 0;min-height:0}
.stack>.fixed{flex:none}
/* header stats (Ben 2026-10-28); sizes and spacing now set by header v3 (.hC) below */
.stats{flex:1;display:flex;justify-content:center;align-items:flex-end;padding:0;min-width:0}
.stat{padding:2px 9px;border-left:1px solid var(--line);min-width:min-content}
.stat:first-child{border-left:none}
.stat .v{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;line-height:1;letter-spacing:-.5px}
.stat .l{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:6px;white-space:nowrap}
.stat .s{font-size:12px;color:var(--sub);margin-top:1px;white-space:nowrap;min-height:16px;overflow:hidden;text-overflow:ellipsis;width:0;min-width:100%}
.stat.bad .v{color:var(--bad)}
.stat.good .v{color:var(--good)}
.stat.zero .v{color:var(--sub)}
/* phone / portrait: no room for the KPI strip — keep only a one-line budget note; the utility bar wraps */
body[data-layout="narrow"] .stats>*,body[data-layout="tall"] .stats>*{display:none}
body[data-layout="narrow"] .stats>.bud,body[data-layout="tall"] .stats>.bud{display:block;border:none;padding:0}
body[data-layout="narrow"] .stats>.bud .v,body[data-layout="tall"] .stats>.bud .v{display:none}
body[data-layout="narrow"] .stats>.bud .l,body[data-layout="tall"] .stats>.bud .l,body[data-layout="narrow"] .stats>.bud .s,body[data-layout="tall"] .stats>.bud .s{display:inline;font-size:14px;margin:0;white-space:nowrap}
body[data-layout="narrow"] .stats>.bud .l::after,body[data-layout="tall"] .stats>.bud .l::after{content:' · '}
body[data-layout="narrow"] .hC .util,body[data-layout="narrow"] .hC .util-r,body[data-layout="narrow"] .hC .hmain{flex-wrap:wrap;row-gap:8px}
body[data-layout="narrow"] .hC .util-r{justify-content:flex-start}
body[data-layout="narrow"] .hC .clock{font-size:56px}
body[data-layout="tall"] .hC .util,body[data-layout="tall"] .hC .util-r{flex-wrap:wrap;row-gap:8px}
/* AI budget (dash-d9, Ben 2026-11-08): a KPI tile like the others, apart from the system light (see header v3 below). */
.stat.bud .l{text-decoration:none}
.cdt.now .cdn,.cdt.now .cdl{color:var(--bad)}
.bdrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.bdrow b{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
/* overdue (Ben 2026-10-28: make it obvious which tasks are overdue) */
.odpill{display:inline-block;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:6px;white-space:nowrap}
button.stat{background:none;border-top:none;border-right:none;border-bottom:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.stat:first-child{border-left:none}
button.stat .l{text-decoration:underline dotted;text-underline-offset:3px}
.detailsRow{display:flex;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--line)}
.defn{font-size:14px;color:var(--sub);padding:0 0 10px}
/* evening: tomorrow + coming up */
.dayrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.dayrow .dn{flex:none;width:86px;font-size:15px;font-weight:500}
.dayrow .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.dayrow .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dayrow .ct{flex:none;width:26px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px}
.dayrow.z .dn,.dayrow.z .ct{color:var(--sub)}
.prow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.prow .t{font-size:16px}
/* weather */
.wx2{background:var(--card);border-radius:20px;padding:20px 24px 16px;display:flex;flex-direction:column;gap:14px;flex:none}
.wx-top{display:flex;align-items:center;gap:14px}
.wx-top .tmp{font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:600;line-height:1;letter-spacing:-1.5px}
.wx-top .lbl{font-size:17px;font-weight:700}
.wx-top .hl{font-size:14px;color:var(--sub);margin-top:3px}
.umbpill{align-self:flex-start;display:flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:10px;padding:6px 11px;font-size:14px;font-weight:700}
.norain{font-size:14px;color:var(--sub)}
.chart{display:flex;flex-direction:column;gap:5px}
.bars{display:flex;gap:4px;align-items:flex-end;height:52px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b i{display:block;width:100%;background:var(--accent);opacity:.35;border-radius:3px 3px 0 0;min-height:3px}
.bars .b.hi i{opacity:.85}
.bars .b span{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:2px}
.wx{background:var(--card);border-radius:20px;padding:16px 22px;display:flex;align-items:center;gap:16px;flex:none}
.wx svg{flex:none}
.wx .tmp{font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:600;line-height:1;letter-spacing:-1px}
.wx .lbl{font-size:16px;font-weight:700}
.wx .hl{font-size:14px;color:var(--sub);margin-top:2px}
.wx .umb{color:var(--accent);font-weight:700;font-size:14.5px;margin-top:4px}
#panel h2 .n{font-family:'Space Grotesk',sans-serif;color:var(--sub);font-weight:600}
.wx.tall{flex-direction:column;align-items:stretch;justify-content:center;gap:10px}
.rain{display:flex;gap:4px;align-items:flex-end;height:38px}
.rain i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;opacity:.8;min-height:2px}
.rainx{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
/* schedule */
.tl{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:stretch}
.tl-time{flex:none;width:56px;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;line-height:1.25}
.tl-time .e{display:block;font-size:13px;color:var(--sub);font-weight:500}
.tl-bar{flex:none;width:4px;border-radius:2px;background:var(--accent)}
.tl.task .tl-bar{background:var(--warn)}
.tl.s-past{opacity:.42}
.tl.s-live .tl-time{color:var(--accent)}
.tl .t{font-size:16.5px}
.livetag{display:inline-block;font-size:12px;font-weight:700;color:var(--card);background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.nowline{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:13px;font-weight:700;padding:4px 0}
.nowline::after{content:'';flex:1;height:2px;background:var(--bad);border-radius:1px}
.tmr{font-size:13.5px;color:var(--sub);padding-top:10px;border-top:1px dashed var(--line)}
.check.sm{width:40px;height:40px;border-radius:10px}
.check.sm svg{padding:8px}
/* FYI */
.fy-g{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.06em;padding:12px 0 6px}
.fy-g:first-child{padding-top:0}
.fy{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.badge{flex:none;min-width:56px;text-align:center;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:700;background:var(--chip);color:var(--ink);margin-top:1px}
.badge.today{background:#FCE9DA;color:var(--warn)}
.badge.new{background:#DDF2E5;color:var(--good)}
body.night .badge.today{background:#3A2A1C}
body.night .badge.new{background:#1C3A2A}
.fy .t{font-size:16px}
.c1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ── Motion (Ben 2026-10-28: subtle and functional; CSS transforms/opacity only — the Surface Pro 5 is a 2017 machine) ── */
main{transition:opacity .22s ease}
body,.card,.col,.wx2,.tab,.hchip,.k{transition:background-color .4s ease,color .4s ease,border-color .4s ease}
.row,.k,.tl,.fy{transition:transform .32s ease,opacity .32s ease}
.leave-r{transform:translateX(64px);opacity:0}
.leave-l{transform:translateX(-64px);opacity:0}
.fresh{animation:freshIn 2.4s ease-out}
@keyframes freshIn{0%{opacity:0;transform:translateY(6px);background:color-mix(in srgb,var(--accent) 18%,transparent)}18%{opacity:1;transform:none}60%{background:color-mix(in srgb,var(--accent) 18%,transparent)}100%{background:transparent}}
.soon{animation:breathe 30s ease-in-out infinite;transform-origin:left center}
@keyframes breathe{0%,6%{transform:scale(1)}3%{transform:scale(1.02)}}
.hchip.lv-bad .dot{animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.wxi .drops{animation:drip 20s linear infinite}
@keyframes drip{0%{transform:translateY(-6px);opacity:0}2%{opacity:1}6%{transform:translateY(10px);opacity:0}100%{transform:translateY(10px);opacity:0}}
.wxi .bolt{animation:flash 20s linear infinite}
@keyframes flash{0%,1%,3%,100%{opacity:1}2%{opacity:.1}}
.allclear{display:flex;align-items:center;gap:10px;color:var(--good);font-weight:600;font-size:16px;padding:12px 0}
.allclear svg{width:28px;height:28px;stroke:var(--good);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.allclear.draw circle{stroke-dasharray:70;stroke-dashoffset:70;animation:drawc .5s ease forwards}
.allclear.draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawc .35s ease .4s forwards}
@keyframes drawc{to{stroke-dashoffset:0}}
.skel{display:grid;grid-template-columns:4fr 5fr 4fr;gap:18px;height:100%}
.skel div{background:var(--card);border-radius:20px;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.45}50%{opacity:.8}}
body.nocursor,body.nocursor *{cursor:none!important}
#toast button{margin-left:14px;background:none;border:none;color:#8FB0FF;font:inherit;font-weight:700;cursor:pointer;padding:0;height:auto}
body.night #toast button{color:#2457D6}
/* ── Swipe + long-press (batch 2) ── */
[data-key^="t:"]{touch-action:pan-y}
.sw-r{background:color-mix(in srgb,var(--good) 18%,transparent)!important;border-radius:12px}
.sw-l{background:color-mix(in srgb,var(--sub) 16%,transparent)!important;border-radius:12px}
.dt-title{font-size:22px;font-weight:700;line-height:1.3;padding-bottom:12px}
.dt{display:grid;grid-template-columns:112px 1fr;gap:9px 14px;font-size:15.5px;padding:12px 0;border-top:1px solid var(--line)}
.dt .dk{color:var(--sub)}
.dt .dv{font-weight:500;min-width:0;overflow-wrap:anywhere}
.dt-actions{display:flex;gap:10px;padding:12px 0}
.dt-qr{display:flex;gap:20px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.qrbox{background:#fff;border-radius:12px;padding:8px;flex:none;width:168px;height:168px;display:flex;align-items:center;justify-content:center;color:#14181F;font-size:12px;text-align:center}
.qrbox svg{width:152px;height:152px;display:block}
/* ── Rituals: Plan my day / Wrap up (batch 4; Ben 2026-10-28: they must leave by themselves) ── */
#ritual{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;z-index:6}
#ritual .rsheet{background:var(--bg);border-radius:24px;padding:26px 28px 20px;width:min(840px,calc(100vw - 32px));max-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:12px;animation:riseIn .28s ease-out}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rhead{display:flex;align-items:flex-start;gap:12px}
.rhead h2{margin:0;font-size:26px;line-height:1.2}
.rkick{font-size:14px;font-weight:700;color:var(--warn);letter-spacing:.04em;margin-bottom:4px}
.rsum{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;color:var(--sub);padding:2px 0 6px}
.rsum b{color:var(--ink);font-weight:600}
.rfoot{display:flex;align-items:center;gap:14px;padding-top:10px;border-top:1px solid var(--line)}
.rfoot .m{flex:1;font-size:14px}
.rhint{font-size:14px;color:var(--sub);padding:0 0 4px}
/* ── Gesture legend (Ben 2026-10-28: always on, so you never have to think which way to swipe) ── */
.hint{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 6px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--chip) 60%,transparent);font-size:12.5px;font-weight:600;color:var(--sub);white-space:nowrap;flex:none;letter-spacing:.01em}
.hint span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.hint svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint .hand svg{width:18px;height:18px;stroke-width:1.8}
.hint .hr{color:var(--good)}
.hint .hand{color:var(--ink)}
.card.dark .hint,.col.today .hint{background:rgba(255,255,255,.09);color:var(--darksub)}
.card.dark .hint .hand,.col.today .hint .hand{color:var(--darkink)}
.col .hint{padding:6px 8px;font-size:12px;margin:0;border-radius:9px}
.hint .hand svg{animation:tapnudge 40s ease-in-out infinite}
@keyframes tapnudge{0%,100%{transform:none}1.5%{transform:translateX(5px)}4%{transform:translateX(-5px)}6%{transform:none}}
.peek{animation:peek 1.4s ease-in-out}
@keyframes peek{0%,100%{transform:none;background:transparent}30%,55%{transform:translateX(22px);background:color-mix(in srgb,var(--good) 16%,transparent);border-radius:12px}}
/* ── Countdowns (dash-d5) ── */
/* Countdown tiles (Ben 2026-11-08, v2): at most 3, sharing the card width — 1 fills it, 2 halve it, 3 take a third each.
   The card never grows. A tile wide enough (≥ 190 px) lays out sideways (big number | title + date); narrow ones stack.
   More than 3 active: the 3 nearest show and the header says so (Ben chooses which to keep, via NW2-Build). */
.cds{display:flex;gap:8px;cursor:pointer}
.cdt{flex:1 1 0;min-width:0;height:92px;background:var(--chip);border-radius:12px;container-type:inline-size}
.cdt .in{height:100%;padding:9px 11px 8px;display:flex;flex-direction:column}
.cdt .cdn{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;line-height:1;letter-spacing:-1px}
.cdt.now .cdn{font-size:19px;line-height:1.5}
.cdt.hot .cdn{color:var(--warn)}
.cdt .cdl{font-size:11px;color:var(--sub);font-weight:600;margin-top:1px;min-height:13px}
.cdt .cdtitle{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdt .cdd{display:none;font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap}
@container (min-width:190px){
  .cdt .in{flex-direction:row;align-items:center;gap:14px;padding:10px 16px}
  .cdt .num{flex:none;text-align:center;min-width:52px}
  .cdt .cdn{font-size:40px}
  .cdt.now .cdn{font-size:24px}
  .cdt .txt{min-width:0}
  .cdt .cdtitle{font-size:15.5px;margin-top:0}
  .cdt .cdd{display:block}
}
.cdt{position:relative}
.cdt.ai{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.cdt.ai .cdtitle,.cdt.ai .cdn{opacity:.78}
.cdt .aib{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--sub);background:var(--chip);border-radius:6px;padding:1px 5px;line-height:14px}
@container (max-width:100px){ .cdt .aib .w{display:none} }
.aitag{font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.cdover{font-size:12.5px;font-weight:600;color:var(--warn);margin-left:auto;margin-right:10px;white-space:nowrap}
@container (max-width:100px){ .cdt .in{padding:8px 8px 7px} .cdt .cdl{display:none} .cdt .cdtitle{font-size:11.5px;line-height:1.2;-webkit-line-clamp:3;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word} }
/* ── Voice input (dash-d5): mic button + review sheet ── */
.tab.mic{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.tab.mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#voice{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;z-index:7}
#voice .vsheet{background:var(--bg);border-radius:24px;padding:26px 28px 20px;width:min(760px,calc(100vw - 32px));display:flex;flex-direction:column;gap:14px;animation:riseIn .28s ease-out}
.vstate{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);min-height:24px}
.vdot{width:12px;height:12px;border-radius:6px;background:var(--bad);flex:none}
.vstate.live .vdot{animation:blink 1.4s ease-in-out infinite}
#vText{width:100%;min-height:150px;max-height:40vh;resize:none;font:inherit;font-size:22px;line-height:1.45;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
#vText::placeholder{color:var(--sub);opacity:.7}
.vlang{display:flex;gap:6px}
.vlang .tab{height:36px;font-size:14px;padding:0 14px}
.vbtns{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.vbtns .m{flex:1}
.vbtns .btn[disabled]{opacity:.45}
/* ── Screen off (Ben 2026-10-30): black page + wake lock released, so Windows' own screen timeout turns the backlight off ── */
#off{position:fixed;inset:0;background:#000;display:none;z-index:50;cursor:none;touch-action:none}
#off .offhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#3A414B;font-size:17px;font-weight:500;animation:offhint 6s ease forwards}
@keyframes offhint{0%,60%{opacity:1}100%{opacity:0}}
.tab.ic{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.tab.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Ben 2026-11-06: while the screen is off the board rests (nothing painted or animated behind the black page, no polling) so the
   Surface runs cooler — its display started failing when warm. */
body.resting #app{visibility:hidden}
body.resting #app *{animation-play-state:paused!important}

/* ── Header v3 (Ben 2026-11-08): one quiet utility bar on top, one main row where everything sits on the same centre line.
   Utility bar: date · Taipei | battery, ritual, Questions, system light, tools. Main row: clock | five equal KPI tiles | mode control.
   Type scale: clock 72, KPI value 32, labels 13, utility 15. Spacing on an 8-px grid. */
header.hC{flex-direction:column;align-items:stretch;gap:12px}
.hC .util{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}
.hC .util-l{display:flex;align-items:baseline;gap:10px;font-size:16px;color:var(--sub);font-weight:500;white-space:nowrap}
.hC .util-l .date{font-size:16px}.hC .util-l .tz{margin:0;font-size:15px}.hC .util-l .tz b{font-size:15px}.hC .util-l .sep{opacity:.5}
.hC .util-r{display:flex;align-items:center;gap:16px}
.hC .chips{gap:8px}.hC .hchip{height:40px;padding:0 14px}
.hC .tools{display:flex;gap:6px}.hC .tools .tab{height:40px;width:40px}
.hC .tools .tab.ic svg,.hC .tools .tab.mic svg{width:18px;height:18px}
.hC .hmain{display:flex;align-items:center;gap:24px}
.hC .clock{font-size:72px;letter-spacing:-2px;flex:none}
.hC .stats{flex:1;display:flex;align-items:stretch;justify-content:stretch;padding:0;min-width:0}
.hC .stat{flex:1 1 0;min-width:0;padding:0 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.hC .stat:first-child{border-left:none;padding-left:0}
.hC .stat .v{font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.hC .stat .v small{font-size:.58em;font-weight:600;vertical-align:baseline;margin-right:1px;color:var(--sub)}
.hC .stat .l{font-size:13px;margin-top:7px}
.hC .stat .s{font-size:12px;margin-top:2px;min-height:16px}
.hC .stat.bud.warn .fc{color:var(--warn);font-weight:600}
.hC .stat.bud.bad .v,.hC .stat.bud.bad .v small,.hC .stat.bud.bad .fc{color:var(--bad)}
.hC .stat.bud .l{text-decoration:none}
/* segmented mode control: one pill, four segments */
.hC .seg{display:inline-flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.hC .seg .tab{height:38px;border:none;background:transparent;padding:0 16px;border-radius:999px;font-size:15px}
.hC .seg .tab.on{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <header class="hC">
    <div class="util">
      <div class="util-l"><span class="date" id="date"></span><span class="sep">·</span><span class="tz" id="tz"></span></div>
      <div class="util-r"><div class="chips"><span class="hchip bchip" id="bchip" style="display:none" aria-label="Battery"></span><button class="hchip" id="rchip" type="button" style="display:none"></button><button class="hchip qchip" id="qchip" type="button">Questions <b id="qn">0</b></button><button class="hchip" id="status" type="button" aria-label="System status"><span class="dot"></span><span id="statusText"></span></button></div>
        <div class="tools"><button class="tab ic" id="refresh" type="button" aria-label="Refresh">↻</button><button class="tab mic" id="mic" type="button" aria-label="Add by voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button><button class="tab ic" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="tab ic" id="off-btn" type="button" aria-label="Screen off"><svg viewBox="0 0 24 24"><path d="M12 3v9M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></button></div>
      </div>
    </div>
    <div class="hmain">
      <div class="clock num" id="clock">--:--</div>
      <div class="stats" id="stats"></div>
      <nav class="tabs seg" aria-label="Mode">
        <button class="tab" data-mode="auto" type="button">Auto</button><button class="tab" data-mode="morning" type="button">Morning</button><button class="tab" data-mode="work" type="button">Work</button><button class="tab" data-mode="evening" type="button">Evening</button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="login"><form id="loginForm">
  <div style="font-size:22px;font-weight:700">Daily Board</div>
  <label for="key" style="color:var(--sub)">Enter the board key (one time only; it stays in this browser)</label>
  <input id="key" type="password" autocomplete="off">
  <button class="btn primary big" type="submit">Start</button>
</form></div>
<div id="healthPanel"><div class="sheet" id="panel"><div style="display:flex;align-items:center;gap:12px"><h2 style="margin:0;font-size:22px;flex:1" id="panelTitle">System Health</h2><button class="btn" id="healthClose" type="button">Close</button></div><div class="list" id="healthBody"></div></div></div>
<div id="ritual"><div class="rsheet"><div class="rhead"><div style="flex:1;min-width:0"><div class="rkick" id="rKick"></div><h2 id="rTitle"></h2></div><button class="btn" id="rClose" type="button">Close</button></div><div class="list" id="rBody"></div><div class="rfoot"><span class="m" id="rCount"></span><button class="btn primary" id="rDone" type="button">Looks good</button></div></div></div>
<div id="voice"><div class="vsheet">
  <div class="rhead"><div style="flex:1;min-width:0"><div class="rkick">ADD TO NW2</div><h2 id="vTitle" style="margin:0;font-size:26px">Say it</h2></div><button class="btn" id="vClose" type="button">Cancel</button></div>
  <div class="vstate" id="vState"><span class="vdot"></span><span id="vStateText"></span></div>
  <textarea id="vText" placeholder="Listening… or tap here to type" maxlength="500"></textarea>
  <div class="vbtns"><div class="vlang" id="vLang"><button class="tab" data-lang="zh-TW" type="button">中文</button><button class="tab" data-lang="en-US" type="button">English</button></div><span class="m" id="vHint"></span><button class="btn" id="vAgain" type="button">Record again</button><button class="btn" id="vStop" type="button">Stop</button><button class="btn primary" id="vSend" type="button">Send to NW2</button></div>
</div></div>
<div id="off"><div class="offhint">Tap to wake</div></div>
<div id="toast"></div>
<script>
const API = 'https://saqlqwushpkdtwsnebed.supabase.co/functions/v1/nw2-dashboard';
const POLL_MS = 60_000;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let key = store.get('nw2.key');
let mode = store.get('nw2.mode') || 'auto';
let data = null, lastOk = 0, failing = false, seenKeys = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const chi = () => { // Houston wall clock
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { h: +p.hour % 24, m: +p.minute, mon: +p.month, day: +p.day, wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };
};
const autoMode = () => { const { h, wd } = chi(); if (h >= 18 || h < 6) return 'evening'; if (h < 9 || wd === 0 || wd === 6) return 'morning'; return 'work'; };
const curMode = () => mode === 'auto' ? autoMode() : mode;
const shortDay = (ymd) => { const d = new Date(ymd + 'T12:00:00Z'); return `${WD[d.getUTCDay()]} ${d.getUTCMonth()+1}/${d.getUTCDate()}`; };

// ═══ 架構（2026-10-27 NW2-Board）══════════════════════════════════════
// 這個檔案是看板本體（board.html）。index.html 是外殼：用 iframe 把這頁包起來，全螢幕放在外殼上，
// 所以這頁重新載入（每天 04:00、Ctrl+R、F5）都不會離開全螢幕。單獨開 board.html 也能用（全螢幕就在自己身上）。
// 資料層：load() 抓一次，5 種版面共用同一份 data。
// 積木層：BLOCKS，每種內容只寫一次（任務卡長相、顏色、按鈕規則在這裡）。改積木 → 所有版面一起變。
// 版面層：LAYOUTS，每種螢幕 × 每個模式（morning／work／evening）放哪些積木、怎麼排。改版面 → 只影響那一種。
//   desk    ① 橫向桌面 1920×1080（公司 Dell 27 吋、家裡 S39C、台灣 VX3276）
//   tall    ② 直立螢幕 1080×1920（公司 Dell 24、家裡 LF24T450F、台灣 23 吋）
//   compact ③ 小螢幕橫向 ~1368×912（Surface 看板、Dragonfly G4／G2、iPad 橫放）
//   narrow  ④ 窄螢幕（iPhone、iPad 直放）
//   tv      ⑤ 客廳電視（網址加 ?view=tv）
// 網址加 ?view=<名稱> 可強制使用某種版面。

// ── 共用小零件 ──
// Overdue = the Do Date or the Due Date is before today and the task isn't done (Ben 2026-10-28). Days = the larger of the two.
const odDays = (t) => Math.max(t.late_days || 0, t.due_in !== null && t.due_in < 0 ? -t.due_in : 0);
function meta(t, opts = {}, inline = false) {
  const bits = [];
  if (t.project) bits.push(esc(t.project));
  if (t.time) bits.push(t.time);
  let late = false;
  const od = odDays(t);
  if (!od && opts.showDate && (t.do_date || t.due_date)) bits.push(shortDay(t.do_date || t.due_date));
  if (!od && t.due_in === 0) { bits.push('due today'); late = true; }
  else if (!od && t.due_in !== null && t.due_in > 0 && t.due_in <= 3) bits.push(`due in ${plural(t.due_in, 'day')}`);
  const tag = inline ? 'span' : 'div';
  const pill = od ? `<span class="odpill">Overdue · ${plural(od, 'day')}</span>` : '';
  return `<${tag} class="m${late ? ' late' : ''}">${pill}${bits.join(' · ')}</${tag}>`;
}
// Gesture legend shown above every swipeable list: ← Tomorrow · hold = details · Done →
const GI = {
  left: '<svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  hand: '<svg viewBox="0 0 24 24"><rect x="10.4" y="7.5" width="3.2" height="11.5" rx="1.6" fill="currentColor" stroke="none"/><path d="M7.2 9.2a4.8 4.8 0 0 1 9.6 0"/><path d="M4.8 7.6a7.6 7.6 0 0 1 14.4 0"/><path d="M8.5 21h7"/></svg>',
};
const hintBar = (compact = false) => `<div class="hint" aria-hidden="true"><span class="hl">${GI.left}${compact ? 'Tomorrow' : 'Swipe · Tomorrow'}</span><span class="hand">${GI.hand}${compact ? 'Hold' : 'Hold · Details'}</span><span class="hr">${compact ? 'Done' : 'Swipe · Done'}${GI.right}</span></div>`;
// Check button with a tick that draws itself when tapped (.on)
const checkBtn = (id, cls = '') => `<button class="check${cls ? ' ' + cls : ''}" type="button" aria-label="Mark done" data-act="done" data-id="${id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>`;
// Item keys for the "new since last fetch" highlight
const tKey = (t) => `t:${t.page_id}`, fKey = (f) => `f:${f.title}|${f.due_date || ''}`, mKey = (s) => `m:${s.start || 'all'}|${s.title}`;
let freshKeys = new Set();
const fr = (k) => (freshKeys.has(k) ? ' fresh' : '');
const initial = (title) => { const m = /^(?:Waiting on|Follow up)\s+([^\s:,&]+)/i.exec(title) || /^([^\s:]+):/.exec(title); return m ? esc([...m[1]].slice(0, 2).join('')) : '…'; };
const cleanTitle = (title) => esc(title.replace(/^Waiting on\s+/i, ''));
const allClear = new Set();
const list = (items, fn, empty, opts) => items.length ? items.map((t) => fn(t, opts)).join('') : (empty.startsWith('<div') ? empty : `<div class="empty">${empty}</div>`);

// ── 任務列的幾種樣式（積木裡用 row: '<名稱>' 指定）──
const ROWS = {
  // 左邊打勾
  check: (t, opts) => `<div class="row${fr(tKey(t))}" data-key="${tKey(t)}">${checkBtn(t.page_id)}<div style="min-width:0"><div class="t">${esc(t.title)}</div>${meta(t, opts)}</div></div>`,
  // 左邊人名縮寫、右邊「明天」（要追的人）
  who: (t, opts) => `<div class="row${fr(tKey(t))}" data-key="${tKey(t)}"><div class="who" aria-hidden="true">${initial(t.title)}</div><div style="min-width:0;flex:1"><div class="t">${cleanTitle(t.title)}</div>${meta(t, opts)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">Tomorrow</button></div>`,
  // 右邊「改明天」＋「完成」
  both: (t) => `<div class="row${fr(tKey(t))}" data-key="${tKey(t)}"><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div>${meta(t)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">Tomorrow</button><button class="btn primary" type="button" data-act="done" data-id="${t.page_id}">Done</button></div>`,
  // 左邊打勾（Done）、右邊「Tomorrow」— for narrow columns (evening wrap-up)
  checkTmr: (t, opts) => `<div class="row${fr(tKey(t))}" data-key="${tKey(t)}">${checkBtn(t.page_id)}<div style="min-width:0;flex:1"><div class="t">${esc(t.title)}</div>${meta(t, opts)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">Tomorrow</button></div>`,
  // 左邊時間（明天的行程）

// ── 資料整理：從 API 的 data 算出積木要用的清單 ──
function derive(d0) {
  // Items with a pending (undoable) action disappear right away; Done Today counts them already.
  const live = (arr) => (arr || []).filter((t) => !pending.has(t.page_id));
  const d = { ...d0 };
  for (const k of ['reminders', 'today_list', 'follow_today', 'waiting', 'undated', 'tomorrow_list', 'later']) d[k] = live(d0[k]);
  const dones = [...pending.values()].filter((p) => p.action === 'done').length;
  d.counts = { ...d0.counts, today: d.today_list.length, done_today: d0.counts.done_today === undefined ? undefined : d0.counts.done_today + dones };
  const hero = d.reminders[0] || d.today_list[0] || null;
  const rest = d.today_list.filter((t) => t !== hero && t.page_id !== hero?.page_id);
  const overdue = [...d.today_list, ...d.follow_today].filter((t) => odDays(t) > 0).sort((a, b) => odDays(b) - odDays(a));
