<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NW2 看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--card:#FFFFFF;--ink:#14181F;--sub:#4A5260;--line:#E3E7ED;--accent:#2457D6;--warn:#B4500B;--chip:#DCE3EC;--dark:#14181F;--darkink:#FFFFFF;--darksub:#AEB6C2}
body.night{--bg:#0F1318;--card:#1A2028;--ink:#E8ECF1;--sub:#9AA5B3;--line:#2A323D;--accent:#8FB0FF;--warn:#F0A35E;--chip:#24364F;--dark:#24364F;--darkink:#E8ECF1;--darksub:#9AA5B3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
.num{font-family:'Space Grotesk',sans-serif}
#app{height:100vh;display:flex;flex-direction:column;padding:28px 40px 24px;gap:20px}
header{display:flex;align-items:flex-end;gap:24px}
.clock{font-size:88px;font-weight:600;line-height:1;letter-spacing:-2px}
.date{font-size:19px;color:var(--sub);font-weight:500}
.grow{flex:1}
.tabs{display:flex;gap:8px}
.tab{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:14px;color:var(--sub);text-align:right}
.status.bad{color:var(--warn);font-weight:700}
main{flex:1;min-height:0}
.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.card.dark{background:var(--dark);color:var(--darkink)}
.card h2{margin:0 0 8px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .n{font-family:'Space Grotesk',sans-serif;color:var(--sub);font-weight:600}
.card.dark h2 .n{color:var(--darksub)}
.list{overflow-y:auto;min-height:0;flex:1}
.row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.card.dark .row{border-color:rgba(255,255,255,.12)}
.check{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid #9AA3B0;background:transparent}
.check:active{background:var(--accent)}
.who{flex:none;width:44px;height:44px;border-radius:22px;background:#E4ECFB;color:#2457D6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
body.night .who{background:#24364F;color:#C3D4FF}
.t{font-size:17px;font-weight:500;line-height:1.38}
.m{font-size:13.5px;color:var(--sub);margin-top:3px}
.card.dark .m{color:var(--darksub)}
.m.late{color:var(--warn)}
.btn{flex:none;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px}
.btn.primary{background:var(--accent);border:none;color:var(--bg);font-weight:700}
.empty{color:var(--sub);font-size:16px;padding:12px 0}
/* morning */
.hero{background:var(--card);border-radius:22px;padding:26px 32px;display:flex;align-items:center;gap:28px}
.hero .lab{font-size:17px;font-weight:700;color:var(--warn)}
.hero .ttl{font-size:34px;font-weight:700;line-height:1.22;margin-top:6px}
.big{height:68px;padding:0 34px;border-radius:16px;font-size:21px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:100%}
.col{background:var(--chip);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.col.today{background:var(--dark);color:var(--darkink)}
.col h2{margin:0;padding:0 4px;font-size:19px;display:flex;justify-content:space-between}
.col .list{display:flex;flex-direction:column;gap:9px}
.k{background:var(--card);border-radius:12px;padding:11px 13px;border:1px solid var(--line);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:500;background:var(--chip);color:var(--ink);margin-right:6px}
.split{display:grid;grid-template-columns:5fr 7fr;gap:32px;height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border-radius:12px;padding:10px 0;text-align:center}
.day.busy{background:var(--chip)}
.day .d{font-size:13px;color:var(--sub)}
.day .c{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600}
.day:not(.busy) .c{color:var(--sub)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center}
#login form{background:var(--card);padding:36px;border-radius:20px;display:flex;flex-direction:column;gap:14px;width:520px}
#login input{height:52px;font-size:18px;padding:0 14px;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;font-size:16px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="date" id="date"></div><div class="clock num" id="clock">--:--</div></div>
    <div class="grow"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <nav class="tabs" aria-label="模式">
        <button class="tab" data-mode="auto" type="button">自動</button>
        <button class="tab" data-mode="morning" type="button">早上</button>
        <button class="tab" data-mode="work" type="button">上班</button>
        <button class="tab" data-mode="evening" type="button">晚上</button>
        <button class="tab" id="refresh" type="button" aria-label="重新整理">↻</button>
      </nav>
      <div class="status" id="status"></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="login"><form id="loginForm">
  <div style="font-size:22px;font-weight:700">NW2 看板</div>
  <label for="key" style="color:var(--sub)">輸入看板金鑰（只要輸入一次，存在這台電腦的瀏覽器）</label>
  <input id="key" type="password" autocomplete="off">
  <button class="btn primary big" type="submit">開始</button>
</form></div>
<div id="toast"></div>
<script>
const API = 'https://saqlqwushpkdtwsnebed.supabase.co/functions/v1/nw2-dashboard';
const POLL_MS = 60_000;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let key = store.get('nw2.key');
let mode = store.get('nw2.mode') || 'auto';
let data = null, lastOk = 0, failing = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','一','二','三','四','五','六'];
const chi = () => { // Houston wall clock
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { h: +p.hour % 24, m: +p.minute, mon: +p.month, day: +p.day, wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };
};
const autoMode = () => { const { h, wd } = chi(); if (h >= 18 || h < 6) return 'evening'; if (h < 9 || wd === 0 || wd === 6) return 'morning'; return 'work'; };
const curMode = () => mode === 'auto' ? autoMode() : mode;
const shortDay = (ymd) => { const d = new Date(ymd + 'T12:00:00Z'); return `${WD[d.getUTCDay()]} ${d.getUTCMonth()+1}/${d.getUTCDate()}`; };

function meta(t, opts = {}, inline = false) {
  const bits = [];
  if (t.project) bits.push(esc(t.project));
  if (t.time) bits.push(t.time);
  let late = false;
  if (t.late_days > 0) { bits.push(t.late_days === 1 ? '昨天的' : `逾期 ${t.late_days} 天`); late = true; }
  else if (opts.showDate && (t.do_date || t.due_date)) bits.push(shortDay(t.do_date || t.due_date));
  if (t.due_in !== null && t.due_in <= 0 && !(t.late_days > 0)) { bits.push(t.due_in === 0 ? '今天到期' : `過期 ${-t.due_in} 天`); late = true; }
  else if (t.due_in !== null && t.due_in > 0 && t.due_in <= 3) bits.push(`${t.due_in} 天後到期`);
  const tag = inline ? 'span' : 'div';
  return `<${tag} class="m${late ? ' late' : ''}">${bits.join(' · ')}</${tag}>`;
}
const initial = (title) => { const m = /^(?:Waiting on|Follow up)\s+([^\s:,&]+)/i.exec(title) || /^([^\s:]+):/.exec(title); return m ? esc([...m[1]].slice(0, 2).join('')) : '…'; };
const cleanTitle = (title) => esc(title.replace(/^Waiting on\s+/i, ''));
const rowCheck = (t, opts) => `<div class="row"><button class="check" type="button" aria-label="完成" data-act="done" data-id="${t.page_id}"></button><div style="min-width:0"><div class="t">${esc(t.title)}</div>${meta(t, opts)}</div></div>`;
const rowWho = (t, opts) => `<div class="row"><div class="who" aria-hidden="true">${initial(t.title)}</div><div style="min-width:0;flex:1"><div class="t">${cleanTitle(t.title)}</div>${meta(t, opts)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">明天</button></div>`;
const list = (items, fn, empty, opts) => items.length ? items.map((t) => fn(t, opts)).join('') : `<div class="empty">${empty}</div>`;

function renderMorning(d) {
  const hero = d.reminders[0] || d.today_list[0];
  const rest = d.today_list.filter((t) => t !== hero && t.page_id !== hero?.page_id);
  const q = d.questions;
  return `<div style="display:flex;flex-direction:column;gap:18px;height:100%">
    ${hero ? `<section class="hero"><div style="flex:1;min-width:0"><div class="lab">${hero.time ? `${hero.time} 提醒` : '今天第一件'}</div><div class="ttl">${esc(hero.title)}</div></div>
      <button class="btn big" type="button" data-act="tomorrow" data-id="${hero.page_id}">改明天</button>
      <button class="btn primary big" type="button" data-act="done" data-id="${hero.page_id}">完成</button></section>`
      : `<section class="hero"><div class="ttl">今天沒有排定的事</div></section>`}
    <div class="grid3" style="flex:1">
      <section class="card"><h2>今天要做 <span class="n">${rest.length}</span></h2><div class="list">${list(rest, rowCheck, '沒有了')}</div></section>
      <section class="card"><h2>今天要追 <span class="n">${d.follow_today.length}</span></h2><div class="list">${list(d.follow_today, rowWho, '今天沒有要追的人')}</div></section>
      <section class="card dark"><h2>NW2 想問你 <span class="n">${q.total}</span></h2><div class="list">${q.items.length ? q.items.map((x) => `<div class="row"><div><div class="m">${esc(x.topic)}</div><div class="t" style="font-weight:400">${esc(x.question)}</div></div></div>`).join('') : '<div class="empty">沒有待答的題目</div>'}</div>
        <div class="m" style="padding-top:8px">到 NW2-Ask 回答（每天 12:10、20:30 會貼）</div></section>
    </div></div>`;
}

function kcard(t, opts) {
  const tags = t.project ? `<span class="tag">${esc(t.project.split(' - ')[0])}</span>` : '';
  const m = meta({ ...t, project: null }, opts, true);
  return `<div class="k"><button class="check" style="width:36px;height:36px" type="button" aria-label="完成" data-act="done" data-id="${t.page_id}"></button><div style="min-width:0"><div class="t" style="font-size:15.5px">${esc(t.title)}</div><div style="margin-top:6px">${tags}${m}</div></div></div>`;
}
function renderWork(d) {
  const col = (name, items, cls, empty, opts) => `<section class="col ${cls}"><h2>${name}<span class="num">${items.length}</span></h2><div class="list">${list(items, kcard, empty, opts)}</div></section>`;
  return `<div class="grid4">
    ${col('今天', d.today_list, 'today', '今天的都做完了')}
    ${col('今天要追', d.follow_today, '', '今天沒有要追的人')}
    ${col('等回覆', d.waiting, '', '沒有在等的', { showDate: true })}
    ${col('沒排日期', d.undated, '', '沒有')}
  </div>`;
}

function renderEvening(d) {
  const left = d.today_list;
  return `<div class="split">
    <div style="display:flex;flex-direction:column;gap:22px;min-height:0">
      <section><h2 style="margin:0 0 10px;font-size:19px">接下來 7 天</h2><div class="week">${d.week.map((w) => `<div class="day${w.n ? ' busy' : ''}"><div class="d">${shortDay(w.date)}</div><div class="c">${w.n}</div></div>`).join('')}</div>
        ${d.later.length ? `<div class="m" style="margin-top:8px">之後：${d.later.slice(0, 3).map((t) => `${esc(t.title)}（${shortDay(t.do_date || t.due_date)}）`).join('、')}</div>` : ''}</section>
      <section class="card" style="flex:1"><h2>今天還沒結的 <span class="n" style="color:var(--warn)">${left.length}</span></h2><div class="list">
        ${left.length ? left.map((t) => `<div class="row"><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div>${meta(t)}</div><button class="btn" type="button" data-act="tomorrow" data-id="${t.page_id}">改明天</button><button class="btn primary" type="button" data-act="done" data-id="${t.page_id}">完成</button></div>`).join('') : '<div class="empty">今天的都結了</div>'}
      </div></section>
    </div>
    <section class="card" style="padding:26px 30px"><h2 style="font-size:26px">明天 · ${shortDay(d.tomorrow)} <span class="n" style="font-size:16px">${d.tomorrow_list.length} 件</span></h2><div class="list">
      ${list(d.tomorrow_list, (t) => `<div class="row"><div style="flex:none;width:64px;color:var(--sub);font-size:15px;padding-top:2px" class="num">${t.time || '全天'}</div><div style="min-width:0"><div class="t" style="font-size:18px">${esc(t.title)}</div>${meta(t)}</div></div>`, '明天沒有排定的事')}
    </div></section>
  </div>`;
}

function render() {
  const m = curMode();
  document.body.classList.toggle('night', m === 'evening');
  document.querySelectorAll('.tab[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  if (!data) return;
  $('main').innerHTML = m === 'morning' ? renderMorning(data) : m === 'work' ? renderWork(data) : renderEvening(data);
}
function tick() {
  const c = chi();
  $('clock').textContent = `${String(c.h).padStart(2,'0')}:${String(c.m).padStart(2,'0')}`;
  $('date').textContent = `星期${WD[c.wd]} · ${c.mon} 月 ${c.day} 日`;
  const st = $('status');
  if (data) {
    const syncMin = data.synced_at ? Math.round((Date.now() - Date.parse(data.synced_at)) / 60000) : null;
    const stale = failing || Date.now() - lastOk > 5 * 60000;
    st.className = 'status' + (stale ? ' bad' : '');
    st.textContent = stale ? '連不上 NW2，顯示的是舊資料' : `Notion 同步於 ${syncMin} 分鐘前`;
  }
}
let lastMode = null;
setInterval(() => { tick(); const m = curMode(); if (m !== lastMode) { lastMode = m; render(); } }, 10_000);

async function load() {
  if (!key) return showLogin();
  try {
    const r = await fetch(API, { headers: { 'x-nw2-dash': key }, cache: 'no-store' });
    if (r.status === 401) { key = null; return showLogin('金鑰不對，請重新輸入'); }
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failing = false; render();
  } catch (e) { failing = true; }
  tick();
}
async function act(action, id) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'x-nw2-dash': key, 'content-type': 'application/json' }, body: JSON.stringify({ action, page_id: id }) });
    toast(r.ok ? (action === 'done' ? '已打勾 Done' : action === 'tomorrow' ? '已改到明天' : '已請 Notion 重新同步') : '沒成功，稍後再試');
  } catch { toast('連不上 NW2'); }
  load();
}
function toast(s) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2500); }
function showLogin(msg) { $('login').style.display = 'flex'; if (msg) toast(msg); $('key').focus(); }
$('loginForm').addEventListener('submit', (e) => { e.preventDefault(); key = $('key').value.trim(); store.set('nw2.key', key); $('login').style.display = 'none'; load(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { mode = b.dataset.mode; store.set('nw2.mode', mode); render(); return; }
  if (b.id === 'refresh') { act('refresh'); setTimeout(load, 8000); return; }
  if (b.dataset.act && b.dataset.id) { b.disabled = true; act(b.dataset.act, b.dataset.id); }
});
// Keep the screen on while the page is visible.
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); load(); } });
wake(); tick(); render(); load(); setInterval(load, POLL_MS);
// Reload once a day (04:00) to pick up new versions of this page.
setInterval(() => { const c = chi(); if (c.h === 4 && c.m < 2) location.reload(); }, 60_000);
</script>
</body>
</html>
