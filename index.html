<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily Board</title>
<style>html,body{margin:0;height:100%;background:#EEF1F4;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<!-- 外殼（2026-10-27）：看板本體在 board.html，這一頁只用 iframe 把它包起來，自己從不重新載入。
     全螢幕放在這一頁的 <html> 上（board.html 會呼叫 top.document.documentElement.requestFullscreen），
     所以 board.html 重新載入（每天 04:00 有新版時、Ctrl+R、F5）都不會動到 Chrome 的全螢幕狀態；
     Ctrl+Shift+R 才會重載整個外殼（之後點一下畫面回到全螢幕）。網址上的 ?view=… 等參數原樣傳給 board.html。
     改這一頁要同時更新主 repo dashboard/index.html 與 nw2-dashboard repo。-->
<iframe id="board" title="Daily Board" allow="fullscreen; screen-wake-lock; microphone" allowfullscreen></iframe>
<script>
const board = document.getElementById('board');
const reloadBoard = () => { const q = new URLSearchParams(location.search); q.set('v', Date.now()); board.src = 'board.html?' + q.toString(); };
reloadBoard();
board.addEventListener('load', () => { try { board.contentWindow.focus(); } catch {} });
// If a key press lands on this page instead of the board: F5 / Ctrl+R reload only the board (full screen stays).
addEventListener('keydown', (e) => { if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'R'))) { e.preventDefault(); if (e.shiftKey) location.reload(); else reloadBoard(); } });
</script>
</body>
</html>
